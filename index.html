/* VOICE: field tool, calm and fast with gloves on.

<script>
window.STANDALONE = true;
// Pilon Homes Inspector - stand-alone adapter.
// Replaces the Claude-hosted services with: this phone's storage (IndexedDB),
// Google Drive (your own Google sign-in) and the Claude API (your own key).
(() => {
  const LSK = { client: "pi_google_client", tok: "pi_g_tok", ret: "pi_return", key: "pi_claude_key", model: "pi_claude_model", data: "pi_data_folder", mod: "pi_remote_mod", seeded: "pi_seeded" };
  const ls = { get: k => { try { return localStorage.getItem(k) || ""; } catch (x) { return ""; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (x) {} } };
  const SCOPE = "https://www.googleapis.com/auth/drive";
  const API = "https://www.googleapis.com/drive/v3", UP = "https://www.googleapis.com/upload/drive/v3";
  const DEFAULT_MODEL = "claude-sonnet-5-5";
  const DATA_FOLDER = "Pilon Homes Inspector Data";
  let needAuth = false;

  // ---- Google sign-in (redirect flow: works in a home-screen app) ----

  let dataFolder = ls.get(LSK.data), nameToId = {}, listeners = { doc: {}, col: {} }, refreshT = null, refreshing = false, idb = null;

      onSnapshot(cb, err) { listeners.doc[path] = cb; scheduleRefresh(); return () => { delete listeners.doc[path]; }; }
    }),
    collection: c => ({ onSnapshot(cb, err) { listeners.col[c] = cb; scheduleRefresh(); return () => { delete listeners.col[c]; }; } })
  };
  function scheduleRefresh(ms) { clearTimeout(refreshT); refreshT = setTimeout(refresh, ms || 60); }
  async function localRecord(path) { if (!idb) return null; try { return await idb.idbGet("docs", path); } catch (x) { return null; } }
  async function refresh() {
    if (refreshing || !token() || navigator.onLine === false) return false;

})();

const PRESETS = [["roof", "General", "info", "Snow Coverage", "Snow covered the roof and limited the view of the covering, flashings and penetrations. Defects may be hidden under the snow. Recommend a qualified roofing contractor inspect the roof once it is clear.", "", "limit"], ["roof", "General", "rec", "Collar Ties Not Observed", "No collar ties were found in the upper third of the rafters. Collar ties help keep rafters from spreading and resist wind uplift, though this is common in older homes and no failure was seen. Recommend a qualified framing contractor evaluate and add collar ties if needed.", "carpenter", "defect"], ["roof", "Coverings", "rec", "Damaged (General)", "The roof covering is damaged. Damaged roofing can let water into the roof deck and attic. Recommend a qualified roofing contractor repair the damaged areas.", "pro", "defect"], ["roof", "Coverings", "rec", "Delamination", "The shingles are delaminating, with the surface layer separating. This shortens shingle life and can lead to leaks. Recommend a qualified roofing contractor repair or replace the affected shingles.", "pro", "defect"], ["roof", "Coverings", "maint", "Discolouration", "The shingles are stained or discoloured, usually from algae, moisture or soot. Staining is mostly cosmetic but can hold moisture on the roof. Recommend cleaning, and a qualified roofing contractor evaluate if the shingles are deteriorating.", "pro", "defect"], ["roof", "Coverings", "rec", "Improper / Incomplete Nailing", "The shingles are not fastened properly. Poorly fastened shingles can lift or blow off in high winds. Recommend a qualified roofing contractor re-fasten or replace them.", "pro", "defect"], ["roof", "Coverings", "rec", "Ponding", "Water is ponding on the roof. Standing water wears the covering faster and can leak at seams. Recommend a qualified roofing contractor correct the slope or drainage.", "pro", "defect"], ["roof", "Coverings", "rec", "Shingles Missing", "Shingles are missing. The exposed areas can let water into the roof deck and attic. Recommend a qualified roofing contractor replace the missing shingles.", "pro", "defect"], ["roof", "Coverings", "rec", "Shingles Torn / Split", "Some shingles are torn or split. Water can reach the roof deck through the openings. Recommend a qualified roofing contractor repair or replace them.", "pro", "defect"], ["roof", "Coverings", "rec", "Tiles Cracked / Broken", "Some roof tiles are cracked or broken. Water can reach the underlayment and roof deck. Recommend a qualified roofing contractor replace the damaged tiles.", "pro", "defect"], ["roof", "Coverings", "maint", "Under-Driven / Raised Nails", "Some nails are raised or not driven flush. Raised nails can push through the shingle above and create leaks. Recommend a qualified roofing contractor reset and seal them.", "pro", "defect"], ["roof", "Coverings", "rec", "Underlayment Damage", "The underlayment is damaged in visible areas. The underlayment is the backup barrier against leaks, and only representative areas could be seen. Recommend a qualified roofing contractor evaluate and repair.", "pro", "defect"], ["roof", "Coverings", "maint", "Exposed Fasteners", "Fastener heads are exposed without sealant. They can rust and let water in around the fastener. Recommend sealing the exposed fasteners as routine maintenance.", "pro", "defect"], ["roof", "Coverings", "rec", "Roof Jacks Not Secured", "The roof jacks (pipe flashings) are not fastened properly. Loose jacks can shift and leak. Recommend a qualified roofing contractor secure and seal them.", "pro", "defect"], ["roof", "Coverings", "rec", "Holes in Shingles", "There are holes in the shingles. Openings let water into the roof structure and can cause rot and interior damage. Recommend a qualified roofing contractor repair or replace the affected shingles.", "pro", "defect"], ["roof", "Coverings", "rec", "Roof-to-Wall Flashing / Sealant Missing", "Flashing or sealant is missing where the roof meets the wall. This joint is a common leak point and can cause hidden rot in the wall. Recommend a qualified roofing contractor install proper flashing.", "pro", "defect"], ["roof", "Coverings", "rec", "Shingles Curling / Lifting", "The shingles are curling and lifting. This is a sign of advanced wear and a reduced ability to shed water. Recommend a qualified roofing contractor evaluate whether repair or replacement is needed.", "pro", "defect"], ["roof", "Coverings", "rec", "Near End of Service Life", "The roof covering is worn and near the end of its service life. Leaks become more likely as it ages. Recommend budgeting for replacement and getting a quote from a qualified roofing contractor.", "pro", "defect"], ["roof", "Coverings", "rec", "Ice Damming", "There are signs of ice damming at the eaves. Ice dams form when attic heat melts snow that refreezes at the eaves, forcing water under the shingles. Recommend improving attic insulation and air sealing, and a qualified roofing contractor check for leaks.", "pro", "defect"], ["roof", "Coverings", "rec", "Hail Damage", "There are marks consistent with hail damage on the roof covering. Hail can crack shingles and remove granules, shortening their life. Recommend a qualified roofing contractor evaluate, and consider contacting your insurer.", "pro", "defect"], ["roof", "Coverings", "maint", "Multiple Layers", "More than one layer of roofing appears to be installed. Extra layers add weight, can hide damage and shorten the life of the top layer. Recommend removing all layers at the next replacement.", "pro", "defect"], ["roof", "Roof Drainage Systems", "maint", "Eavestrough Debris", "The eavestroughs are full of debris. Blocked eavestroughs overflow next to the foundation and can cause ice build-up at the eaves. Recommend cleaning them each spring and fall as routine maintenance.", "diy", "defect"], ["roof", "Roof Drainage Systems", "rec", "Downspouts Drain Near House", "One or more downspouts discharge next to the foundation. Water near the foundation can cause basement leaks and soil movement. Recommend adding extensions so water discharges at least 1.8 m (6 ft) from the house.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Downspouts Missing", "Downspouts are missing in one or more areas. Roof water will discharge next to the foundation and can cause basement leaks. Recommend a qualified eavestrough contractor install downspouts and extensions.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Eavestrough Damaged", "The eavestroughs are damaged. Damaged sections leak and drop water next to the foundation. Recommend a qualified eavestrough contractor repair or replace them.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Eavestrough Improperly Sloped", "The eavestroughs do not slope toward the downspouts. Standing water overflows near the foundation and adds weight that pulls the troughs loose. Recommend a qualified eavestrough contractor re-slope them.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Eavestrough Leaking", "The eavestroughs leak. Leaking water saturates the soil at the foundation and damages the fascia. Recommend a qualified eavestrough contractor reseal or repair them.", "pro", "defect"], ["roof", "Roof Drainage Systems", "maint", "Eavestrough Loose", "The eavestrough is loose from the fascia. Loose troughs can sag, overflow or fall. Recommend a qualified eavestrough contractor re-secure it.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Eavestroughs Missing", "There are no eavestroughs. Roof water falls next to the foundation and can cause basement leaks, erosion and siding damage. Recommend a qualified eavestrough contractor install eavestroughs and downspouts.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Drainage Improperly Installed", "The roof drainage is not installed properly, with poor slope or misaligned pipes. Water may collect near the foundation. Recommend a qualified eavestrough contractor correct it.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Downspout Damaged", "A downspout is damaged. Water can discharge next to the foundation. Recommend a qualified eavestrough contractor repair or replace it.", "pro", "defect"], ["roof", "Roof Drainage Systems", "rec", "Eavestrough Drains Onto Roof", "An upper eavestrough drains onto the lower roof. Concentrated water wears the shingles faster and can cause leaks. Recommend a qualified eavestrough contractor extend the downspout to the lower eavestrough.", "pro", "defect"], ["roof", "Flashings", "maint", "Corrosion - Minor", "The roof flashing has minor corrosion but appears serviceable. Corrosion can spread and eventually leak. Recommend monitoring and repair by a qualified roofing contractor if it worsens.", "monitor", "defect"], ["roof", "Flashings", "rec", "Corrosion - Severe", "The roof flashing is badly corroded. Corroded flashing can leak into the roof structure. Recommend a qualified roofing contractor replace it.", "pro", "defect"], ["roof", "Flashings", "rec", "Loose / Separated", "The flashing is loose or separated. Water can get into the roof structure and walls. Recommend a qualified roofing contractor re-secure and seal it.", "pro", "defect"], ["roof", "Flashings", "rec", "Missing", "Flashing is missing in one or more locations. Flashing keeps water out of joints and transitions. Recommend a qualified roofing contractor install flashing.", "pro", "defect"], ["roof", "Flashings", "rec", "Drip Edge Missing", "There is no drip edge at the roof edge. Water can wick behind the eavestrough and rot the sheathing and fascia. Recommend a qualified roofing contractor install drip edge.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Chimney Cap Missing", "The chimney has no cap. A cap keeps rain, snow and animals out of the flue. Recommend a qualified chimney professional install one.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "safety", "Chimney Flue Cracked", "The chimney flue liner is cracked. This is a fire hazard: heat and combustion gases can reach the house framing. Recommend a WETT-certified chimney professional evaluate and repair before use.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Chimney Repointing Needed", "The chimney mortar joints are deteriorated. Open joints let water in and speed up freeze-thaw damage. Recommend a qualified masonry contractor repoint the chimney.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "safety", "Chimney Unlined", "The chimney does not appear to have a flue liner. This is a safety hazard: combustion gases and heat can escape into the structure. Recommend a WETT-certified chimney professional evaluate and line it before use.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "maint", "Metal Chimney Rust", "The metal chimney is rusting. Rust shortens its life and can lead to holes. Recommend monitoring and replacement by a WETT-certified chimney professional when needed.", "monitor", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Skylight Cracked", "The skylight is cracked. Cracks can leak and spread. Recommend a qualified roofing or skylight contractor repair or replace it.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Skylight Leak Signs", "There are signs of water entry at the skylight. Skylights often leak when flashing is worn or poorly installed. Recommend a qualified roofing contractor evaluate the flashing and repair.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Roof Vent Cracked", "A roof vent is cracked. Water can get into the attic. Recommend a qualified roofing contractor repair or replace it.", "pro", "defect"], ["roof", "Skylights, Chimneys & Other Roof Penetrations", "rec", "Plumbing Vent Boot Cracked", "The rubber boot around the plumbing vent is cracked. This is a common leak point. Recommend a qualified roofing contractor replace it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Cracking - Major", "The exterior cladding has significant cracking. This can be caused by foundation movement or soil settlement. Recommend a structural engineer evaluate.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "maint", "Cracking - Minor", "The siding has minor cracks, usually from temperature changes or settlement. Cracks can let water behind the siding. Recommend sealing them and monitoring.", "monitor", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Evidence of Water Intrusion", "There are signs of water getting behind the siding. Trapped water can rot the sheathing and framing. Recommend a qualified siding contractor find the source and repair.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Improper Flashing / Trim", "The flashing and trim are not installed properly. This can direct water behind the siding. Recommend a qualified siding contractor correct it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Hail Damage - Major", "The siding has significant hail damage. Damaged siding can let water behind the cladding. Recommend a qualified siding contractor repair, and consider contacting your insurer.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "maint", "Hail Damage - Minor", "The siding has minor hail marks that appear cosmetic. Small openings can still let water in over time. Recommend monitoring and sealing any openings.", "monitor", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Improper Installation", "The siding does not appear to be installed to standard practice. This can let water behind the siding and damage the wall. Recommend a qualified siding contractor evaluate and correct.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Loose Siding", "Some siding is loose. Loose pieces can blow off and let water in. Recommend a qualified siding contractor re-secure it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "maint", "Paint / Finish Needed", "The siding finish is worn. Bare wood absorbs moisture and deteriorates faster. Recommend a qualified painter prepare and refinish it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Siding Splitting", "Some siding is split. Splits can let water behind the siding. Recommend a qualified siding contractor replace the affected pieces.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Warping / Buckling", "The vinyl siding is warped or buckled, often from being nailed too tight. Siding that cannot expand and contract can pull loose. Recommend a qualified siding contractor re-hang it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "maint", "Vinyl Siding - Heat Damage", "The vinyl siding is warped or melted from a heat source such as a barbecue. Damaged siding can let water in. Recommend replacing it and keeping heat sources away from the wall.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Siding Missing", "Siding is missing. The exposed wall is open to water and pests. Recommend a qualified siding contractor replace it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "General Damage", "The siding is damaged (cracks, holes or impact marks). Damaged siding can let water into the wall. Recommend a qualified siding contractor repair or replace it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Starter Strip Not Engaged", "The bottom row of vinyl siding is not locked into the starter strip. It can move in wind and let water in. Recommend a qualified siding contractor re-secure it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Unsealed Wall Penetrations", "There are unsealed openings in the exterior wall. They let in water, air and pests. Recommend sealing them with exterior sealant as routine maintenance.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "J-Channel Missing at Windows", "J-channel trim is missing around one or more windows. Water can get behind the siding at the window. Recommend a qualified siding contractor install J-channel and flashing.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Loose Brick", "Some brick in the veneer is loose. Loose brick lets water behind the veneer and can fall. Recommend a qualified masonry contractor reset and repoint it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Evidence of Settlement", "Cracks and gaps in the siding and trim suggest the house has settled. Some settlement is normal, but ongoing movement can damage the structure. Recommend a structural engineer evaluate if cracks are wide or growing.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "maint", "Wood Trim - Minor Damage", "The exterior wood trim has minor damage. Unprotected wood absorbs water and can rot. Recommend repairing and repainting it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Stone Veneer Damage", "The stone veneer is damaged. Water can get behind the cladding. Recommend a qualified masonry contractor repair it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Log Sealing Required", "The chinking between the logs is deteriorated. Gaps let water and air into the wall and can cause rot. Recommend a qualified log home contractor reseal it.", "pro", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Rotted Trim / Moulding", "The exterior trim is rotted. Rot shows ongoing moisture and can spread into the wall. Recommend a qualified carpenter replace it and correct the moisture source.", "carpenter", "defect"], ["exterior", "Siding, Flashing & Trim", "rec", "Deflection at Eaves", "The eaves are sagging slightly. This can be caused by poor support, settlement or moisture damage. Recommend a qualified contractor evaluate, or a structural engineer if it is getting worse.", "pro", "defect"], ["exterior", "Exterior Doors", "maint", "Door Does Not Latch", "The exterior door does not close or latch properly. This affects security and lets drafts in. Recommend adjusting the latch or strike plate as routine maintenance.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Hardware Damaged", "The door hardware is damaged. This can affect security and operation. Recommend repairing or replacing it.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Hardware Missing", "The door is missing hardware. This can affect security and operation. Recommend installing the missing parts.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Loose Hinge", "A hinge on the exterior door is loose. A loose hinge lets the door sag and stop sealing. Recommend tightening the screws, using longer screws if stripped.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Paint / Refinish Needed", "The door finish is worn. Unprotected doors absorb moisture and deteriorate. Recommend refinishing or painting it.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Patio Door - Failed Seal", "There is condensation between the panes of the patio door, which means the seal has failed. This reduces efficiency and clarity. Recommend a qualified window and door contractor replace the glass unit.", "pro", "defect"], ["exterior", "Exterior Doors", "rec", "Weatherstripping Missing", "The door has no weatherstripping. This lets in drafts, cold and water. Recommend installing weatherstripping.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Hardware Not Installed Properly", "The door hardware is not installed properly. This can affect operation and security. Recommend a qualified handyman adjust or reinstall it.", "pro", "defect"], ["exterior", "Exterior Doors", "maint", "Door Screen Damaged", "The door screen is torn or damaged. Insects can get in. Recommend repairing or replacing it.", "diy", "defect"], ["exterior", "Exterior Doors", "maint", "Cosmetic Damage", "The exterior door has cosmetic wear and damage. This does not affect function. Recommend repairing or refinishing as desired.", "pro", "defect"], ["exterior", "Exterior Doors", "rec", "Misaligned Door", "The door does not sit evenly in its frame. A misaligned door may not latch or seal. Recommend a qualified door contractor adjust it.", "pro", "defect"], ["exterior", "Exterior Doors", "rec", "General Damage", "The exterior door is damaged. This can affect operation, sealing and security. Recommend a qualified door contractor repair or replace it.", "pro", "defect"], ["exterior", "Exterior Doors", "maint", "Weatherstripping Damaged", "The door weatherstripping is damaged. This lets in drafts and causes heat loss. Recommend replacing it.", "diy", "defect"], ["exterior", "Exterior Doors", "rec", "Door Frame Cladding Damaged", "The metal or vinyl cladding around the door frame is damaged. Water can get into the frame. Recommend a qualified contractor repair it.", "pro", "defect"], ["exterior", "Exterior Doors", "rec", "Moisture Damage at Door Frame", "The door frame and brick mould show moisture damage. Ongoing water entry can rot the frame and the framing below. Recommend a qualified contractor find the source and repair the damage.", "pro", "defect"], ["exterior", "Exterior Doors", "maint", "Storm Door - Window Sash Not Holding", "The sliding sash in the storm door does not stay in place, likely from broken adjustment pins. The sash can drop unexpectedly. Recommend repairing or replacing the hardware.", "pro", "defect"], ["exterior", "Exterior Doors", "maint", "Storm Door Closer Missing", "The storm door has no closer. The door can slam or blow open in wind. Recommend installing a closer.", "diy", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "maint", "Deck - Loose Boards", "Some deck boards are loose. Loose boards can shift and cause trips. Recommend re-fastening them with deck screws.", "diy", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "maint", "Deck - Nails Exposed", "Nails are raised on the deck surface. They are a tripping and injury hazard. Recommend resetting them or replacing with deck screws.", "diy", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Deck - Rotted Boards", "Some deck boards are rotted. Rotted boards can break underfoot. Recommend a qualified deck contractor replace them and check the framing.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Deck - Unstable Support", "The deck supports appear unstable. This is a safety hazard: the deck could collapse. Recommend a qualified deck contractor repair before the deck is used.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "maint", "Deck - Sealing Needed", "The deck surface is weathered. Unprotected wood absorbs water and rots faster. Recommend cleaning and sealing as routine maintenance.", "diy", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Improper Construction", "The deck does not appear to be built to standard practice (fastening, spacing, ledger or materials). This can affect its strength. Recommend a qualified deck contractor evaluate and correct.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Stairs - Deteriorated", "The exterior stairs are deteriorated. This creates a tripping hazard. Recommend a qualified contractor repair them.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Stair Stringers Not Fastened", "The stair stringers are not fastened to the deck. This is a safety hazard: the stairs can shift or collapse. Recommend a qualified deck contractor secure them.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Deck - Guard Missing", "The deck has no guard where the surface is more than 600 mm (24 in) above the ground. This is a fall hazard. Recommend a qualified deck contractor install a guard.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Guard - Inadequate Support", "The deck guard moves when pushed. This is a fall hazard. Recommend a qualified deck contractor reinforce it.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Deck - Damaged Joist", "A deck joist is damaged. This is a structural concern: the deck may not carry its load safely. Recommend a qualified deck contractor repair it before heavy use.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Steps Not Secured", "The entry steps are not secured. Loose steps can shift underfoot and cause falls. Recommend a qualified contractor anchor them.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Rotted Structural Beam", "A deck or porch beam is rotted. This is a structural concern: rot weakens the beam and can lead to failure. Recommend a qualified contractor replace the beam.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Stairs - Handrail Height", "The handrail is lower than the usual 865 to 965 mm (34 to 38 in) above the stair nosing. A low handrail is harder to grab during a fall. Recommend a qualified contractor raise or replace it.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Guard Openings Too Large", "Openings in the guard are larger than 100 mm (4 in). This is a fall hazard: a small child can slip through. Recommend a qualified contractor add balusters or infill.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Pergola - Loose Roofing", "The roofing panels on the pergola or patio cover are loose. Panels can lift in wind and cause damage or injury. Recommend re-fastening them.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Rim Joist Missing / Deteriorated", "The deck rim joist is missing or badly deteriorated. This is a structural concern: the rim joist ties and supports the joists. Recommend a qualified carpenter repair it.", "carpenter", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Rim Joist Separating", "The rim joist is separating from the deck joists. This weakens the framing. Recommend a qualified carpenter re-fasten it with proper hangers.", "carpenter", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Deck Shifting Off Supports", "The deck is shifting off its foundation blocks. This is a safety hazard: the deck has lost proper support. Recommend a qualified deck contractor install proper footings.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Moisture in Deck Post", "A covered deck post is wet. Trapped moisture can rot the post. Recommend a qualified deck contractor check for rot and repair.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Loose Railing", "A railing is loose. This is a fall hazard. Recommend a qualified contractor secure it.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "maint", "Concrete Landing Cracked", "The concrete landing is cracked. Water in the cracks freezes and widens them. Recommend sealing the cracks and monitoring for movement.", "monitor", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "No Landing at Exterior Door", "There is no deck or landing below an exterior door. This is a fall hazard for anyone stepping out. Recommend locking the door until a qualified contractor builds a landing with steps and a guard.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "rec", "Moisture in Beam", "A deck or porch beam is wet. Ongoing moisture can lead to rot. Recommend a qualified contractor find the source and check the beam.", "pro", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "maint", "Torn Screen", "A screen is torn. Insects can get in. Recommend repairing or replacing it.", "diy", "defect"], ["exterior", "Decks, Balconies, Porches & Steps", "safety", "Ledger Not Properly Attached", "The deck ledger is not properly bolted to the house or is not flashed. This is a safety hazard: ledger failure is a leading cause of deck collapse, and water can rot the house framing. Recommend a qualified deck contractor correct it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Eaves - Damaged", "The eaves are damaged. Water and pests can get into the roof structure. Recommend a qualified roofing contractor repair them.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Eaves - Water Stains", "There are water stains under the eaves. This may be from a roof or eavestrough leak or ice damming. Recommend a qualified roofing contractor find the source and repair.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Fascia - Damaged", "The fascia is damaged. Water can get into the roof framing and the eavestrough may not stay secure. Recommend a qualified contractor repair it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Fascia - Loose", "The fascia is loose. Water and pests can get in, and it may not hold the eavestrough. Recommend a qualified contractor re-secure it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Fascia - Rotted", "The fascia is rotted. Rot shows ongoing moisture and can spread to the rafter ends. Recommend a qualified carpenter replace it and correct the moisture source.", "carpenter", "defect"], ["exterior", "Eaves, Soffits & Fascia", "maint", "Wasp Nest", "There are wasp nests under the soffits. Wasps are a stinging hazard near doors and windows. Recommend removal by a pest control professional.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Soffit - Damaged", "The soffit is damaged, with openings where birds or small animals can enter. Damaged soffit can also reduce attic ventilation. Recommend a qualified contractor repair it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Eaves - Improper Installation", "The eaves are not installed to standard practice. Water and pests can get into the roof structure. Recommend a qualified roofing contractor correct it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Fascia - Improper Installation", "The fascia cladding is lapped in the wrong direction. Water can run behind it. Recommend a qualified contractor re-lap it.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Fascia Flashing Missing", "Drip edge or fascia flashing is missing at the eaves. Water can run behind the eavestrough and rot the fascia. Recommend a qualified roofing contractor install flashing.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "maint", "Fascia - Paint Needed", "The wood fascia needs paint. Bare wood absorbs moisture and rots. Recommend repainting as routine maintenance.", "pro", "defect"], ["exterior", "Eaves, Soffits & Fascia", "maint", "Vegetation in Soffit", "Plants are growing in the soffit. This points to trapped debris and moisture and can attract pests. Recommend removing it and checking for damage.", "diy", "defect"], ["exterior", "Eaves, Soffits & Fascia", "rec", "Soffit Loose in J-Channel", "The soffit is not secured in its channel. It can fall out and let pests and snow into the attic. Recommend a qualified contractor re-secure it.", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "rec", "Negative Grading", "The ground slopes toward the house in some areas. This directs water to the foundation and can cause basement leaks. Recommend regrading so soil drops about 150 mm over the first 3 m (6 in over 10 ft).", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "rec", "Retaining Wall Deteriorated", "The retaining wall is cracked, leaning or deteriorated. A failing wall can collapse. Recommend a qualified contractor evaluate and repair it.", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "rec", "Standing Water", "There is standing water on the lot. This points to poor drainage or grading. Recommend a landscaper improve drainage and monitoring after rain and snow melt.", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "maint", "Tree Debris on Roof", "There is tree debris on the roof. Debris holds moisture and blocks drainage. Recommend clearing the roof and eavestroughs as routine maintenance.", "diy", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "maint", "Tree Overhang", "Trees overhang the roof. Branches can damage the roof and add debris. Recommend a qualified tree service trim them back.", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "maint", "Downspout Extensions Not Connected", "The downspout extensions are not connected. Water will discharge next to the foundation. Recommend reattaching them so water lands at least 1.8 m (6 ft) from the house.", "diy", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "maint", "Vegetation Too Close to House", "Plants are touching or very close to the house. They hold moisture against the wall and give pests a path inside. Recommend keeping vegetation trimmed back.", "diy", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "rec", "Window Well Issues", "A window well has debris, poor drainage or soil within 150 mm (6 in) of the window. Water can collect and leak through the window. Recommend cleaning the well, lowering the soil and adding a cover.", "pro", "defect"], ["exterior", "Vegetation, Grading, Drainage & Retaining Walls", "rec", "Wood-to-Soil Contact", "Wood siding, trim or framing is touching the soil. This leads to rot and gives insects access. Recommend keeping wood at least 150 mm (6 in) above the soil.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "rec", "Driveway Cracking - Major", "The driveway has major cracks. Large cracks let water under the slab and can lead to heaving. Recommend a qualified concrete contractor repair or replace it.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "maint", "Driveway Cracking - Minor", "The driveway has minor cracks, which are common. Water in cracks freezes and widens them. Recommend sealing them and monitoring.", "monitor", "defect"], ["exterior", "Walkways, Patios & Driveways", "rec", "Driveway Slopes Toward House", "The driveway slopes toward the house. This directs water to the foundation. Recommend a qualified contractor correct the drainage.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "rec", "Trip Hazard", "Uneven sections create a trip hazard. Height differences of more than a few centimetres can catch a toe. Recommend a qualified contractor level or repair them.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "rec", "Patio Cracking - Major", "The patio has significant settlement and cracking. This can create trip hazards and direct water toward the house. Recommend a qualified concrete contractor repair it.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "maint", "Patio Cracking - Minor", "The patio has minor cracks from normal settlement. Water in cracks freezes and widens them. Recommend sealing them and monitoring.", "monitor", "defect"], ["exterior", "Walkways, Patios & Driveways", "rec", "Walkway Cracking - Major", "The walkway has major cracks. This creates a trip hazard. Recommend a qualified concrete contractor repair or replace it.", "pro", "defect"], ["exterior", "Walkways, Patios & Driveways", "maint", "Walkway Cracking - Minor", "The walkway has minor cracks. Water in cracks freezes and widens them. Recommend sealing them and monitoring.", "monitor", "defect"], ["exterior", "Walkways, Patios & Driveways", "info", "Ice / Snow Coverage", "Ice and snow covered the walkways and driveway, so their surfaces could not be fully inspected. Defects may be hidden.", "", "limit"], ["exterior", "Walkways, Patios & Driveways", "rec", "Walkway Deteriorated", "The walkway surface is breaking down (cracking or spalling). This creates a trip hazard. Recommend a qualified contractor repair or replace it.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Foundation Cracks - Major", "The foundation has significant cracking. This is a significant structural concern: soil movement can cause further damage and water entry. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "maint", "Foundation Cracks - Minor", "The foundation has minor shrinkage cracks, which are common in concrete. Cracks can widen or let water in over time. Recommend monitoring and sealing them if water enters.", "monitor", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Heaving / Settlement", "The floor slab has heaved or settled from soil movement. This is a significant structural concern: movement can damage walls, framing and plumbing. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "rec", "Improper Construction", "The foundation does not appear to be built to standard practice. This can affect how well it supports the house. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "rec", "Poor Ventilation", "The basement or foundation area is poorly ventilated. This can lead to high humidity, condensation and mould. Recommend improving air circulation and using a dehumidifier to keep humidity below about 50%.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Wall Bowing / Leaning", "The foundation wall is bowing or leaning. This is a significant structural concern: soil pressure can cause the wall to fail. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Water Intrusion", "Water is actively entering the basement or crawlspace. This is a significant concern: ongoing water damages finishes, promotes mould and can weaken the soil under the foundation. Recommend a qualified waterproofing contractor find and correct the source.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "rec", "Support Cribs Not Level", "Some of the support cribs are not level. Uneven support can cause the structure to shift. Recommend a qualified contractor level and shim them.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "maint", "Parging Deteriorated", "The parging on the foundation is cracked or deteriorated. Parging protects the foundation from weather and moisture. Recommend a qualified contractor repair it.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "maint", "Parging - Previous Moisture", "The parging is deteriorating and shows signs of past moisture that appear to have been repaired. Damaged parging lets moisture into the foundation. Recommend monitoring and repairing it as needed.", "monitor", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Wood Foundation - Deflection", "The preserved wood foundation is bowing. This is a significant structural concern: soil pressure, moisture or decay can lead to failure. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "safety", "Block Wall - Major Deflection", "The concrete block foundation wall is bowing inward significantly. This is a significant structural concern: the wall may continue to move. Recommend a structural engineer evaluate as soon as possible.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "maint", "Parging Missing", "Parging is missing from the exposed foundation. Unprotected concrete is more exposed to moisture and freeze-thaw damage. Recommend a qualified contractor apply parging.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "rec", "Block Wall - Minor Deflection", "The concrete block foundation wall has minor bowing. This is common in older foundations but should not get worse. Recommend a qualified foundation contractor evaluate and monitoring for movement.", "pro", "defect"], ["basement-foundation-craw", "Foundation", "maint", "Previously Patched Crack", "A foundation crack has been patched. Patched cracks can reopen or leak. Recommend asking the seller about its history and monitoring it.", "monitor", "defect"], ["basement-foundation-craw", "Basements & Crawlspaces", "rec", "Efflorescence", "There is efflorescence (white mineral deposits) on the foundation wall. It shows moisture is moving through the concrete. Recommend improving grading and roof drainage, and a qualified contractor evaluate if it continues.", "pro", "defect"], ["basement-foundation-craw", "Basements & Crawlspaces", "rec", "High Moisture Levels", "Moisture readings in the basement are high. Ongoing moisture can damage materials and lead to mould. Recommend a qualified contractor find and correct the source.", "pro", "defect"], ["basement-foundation-craw", "Basements & Crawlspaces", "rec", "Signs of Standing Water", "There are signs that water has stood on the basement floor. This points to past flooding or a drainage problem. Recommend asking the seller about its history and a qualified contractor find the source.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "safety", "Slab Shifting / Cracking", "The concrete slab is shifting or cracking. This is a significant structural concern: moisture or soil movement may be the cause. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "safety", "Structural Damage", "The floor structure is damaged. This is a significant structural concern: the floor may not carry its load safely. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "maint", "Evidence of Previous Water", "There are signs of past water in the floor structure, but no active moisture was found. Water can return if the cause was not fixed. Recommend asking the seller about the history and monitoring.", "monitor", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Joists Need Repair", "Some floor joists are damaged, cut or improperly installed. This can weaken the floor. Recommend a structural engineer or qualified framing contractor evaluate.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Suspected Mould", "There is mould-like growth on the floor structure. Testing is needed to confirm what it is, and mould can affect air quality. Recommend correcting the moisture source and a qualified mould remediation contractor evaluate.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "maint", "Floor Covering Damaged", "The basement floor covering is damaged. This can create trip hazards. Recommend repairing or replacing it.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Cribbing Shifted - Floor Settlement", "The support cribbing has shifted and the floor has settled. This can get worse over time. Recommend a qualified contractor re-level and secure the cribbing.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Possible Moisture (Thermal Imaging)", "Thermal imaging showed a cool area on the basement wall and floor that may be moisture. Hidden moisture can damage materials and lead to mould. Recommend confirming with a moisture meter and finding the source.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Moisture at Well Pump", "There is moisture staining near the well pump. This may be a leak at the pump or fittings. Recommend a licensed plumber or well contractor check for leaks.", "plumber", "defect"], ["basement-foundation-craw", "Floor Structure", "maint", "Hollow Area Under Floor Covering", "An area under the basement floor covering sounds hollow. It may be a cleanout or backwater valve access, which could not be confirmed. Recommend asking the seller about it.", "monitor", "defect"], ["basement-foundation-craw", "Floor Structure", "maint", "Minor Floor Cracking", "The floor has minor cracks from normal settlement and seasonal movement. Cracks can widen over time. Recommend monitoring them.", "monitor", "defect"], ["basement-foundation-craw", "Floor Structure", "safety", "Wood Post - Moisture Damage", "The base of a wood support post is wet. This is a structural concern: moisture can rot the post and reduce support for the floor above. Recommend correcting the moisture source and a qualified contractor check the post.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "maint", "Minor Concrete Deterioration", "The concrete floor has minor surface spalling. Spalling can spread if moisture continues. Recommend a qualified concrete contractor seal or patch it.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Adjustable Post Not Secured", "An adjustable steel post (telepost) is not fastened at the top or bottom. An unsecured post can shift and lose support. Recommend a qualified contractor fasten it to the beam and floor.", "pro", "defect"], ["basement-foundation-craw", "Floor Structure", "rec", "Notched / Cut Joists", "Floor joists have been notched or cut, likely for plumbing, ducts or wiring. This can weaken the floor. Recommend a structural engineer or qualified framing contractor evaluate.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "safety", "Cracks - Major", "The wall structure has major cracking. This is a significant structural concern: soil movement or moisture may be the cause. Recommend a structural engineer ineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "safety", "Beam - Insufficient Support", "A beam does not have adequate support. This is a significant structural concern: the beam can sag or fail. Recommend a qualified contractor add support, with a structural engineer's direction if needed.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "rec", "Moisture on Foundation Wall", "There is moisture on the foundation wall. This may be water entry or condensation. Recommend a qualified contractor find and correct the source.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "safety", "Support Post Deflection", "A support post is bowing. This is a significant structural concern: it may not be carrying the load properly. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "maint", "Wall Panel Damaged", "A basement wall panel is damaged. This is mostly cosmetic. Recommend repairing or replacing it.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "rec", "Missing Insulation / Vapour Barrier", "The exterior walls have no insulation or vapour barrier. This causes heat loss and condensation. Recommend an insulation contractor insulate and install vapour barrier.", "pro", "defect"], ["basement-foundation-craw", "Wall Structure", "rec", "Cool Areas (Thermal Imaging)", "Thermal imaging showed cool areas on the wall, consistent with missing insulation or moisture. Either can cause heat loss or hidden damage. Recommend confirming with a moisture meter and a qualified contractor investigate.", "pro", "defect"], ["basement-foundation-craw", "Ceiling Structure", "safety", "Structural Damage", "The ceiling structure is damaged. This is a significant structural concern: the framing may not carry its load safely. Recommend a structural engineer evaluate.", "pro", "defect"], ["basement-foundation-craw", "Ceiling Structure", "rec", "Evidence of Wat

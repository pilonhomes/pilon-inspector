turn Air Missing / Insufficient", "There are too few return air registers. This reduces airflow and comfort. Recommend a qualified HVAC contractor add returns.", "pro", "defect"], ["heating", "Distribution Systems", "rec", "Disconnected Duct", "A duct has come apart at a joint. Heated air is lost into the wall or ceiling. Recommend a qualified HVAC contractor reconnect and seal it.", "pro", "defect"], ["cooling", "Cooling Equipment", "info", "Not Tested - Low Temperature", "The air conditioner was not tested because it was below about 15 °C (60 °F) outside. Running it in cold weather can damage the compressor.", "", "limit"], ["cooling", "Cooling Equipment", "rec", "Condensate Line Damaged", "The condensate line is damaged. Water from the cooling coil may not drain. Recommend a qualified HVAC contractor repair it.", "pro", "defect"], ["cooling", "Cooling Equipment", "rec", "No Cooling", "The air conditioner ran but did not cool. The system may be low on refrigerant or faulty. Recommend a qualified HVAC contractor evaluate.", "pro", "defect"], ["cooling", "Cooling Equipment", "maint", "Line Insulation Missing / Damaged", "The insulation on the refrigerant line is missing or damaged. This wastes energy and can cause condensation. Recommend replacing it.", "pro", "defect"], ["cooling", "Cooling Equipment", "info", "Power Recently Restored", "Power to the outdoor unit was off, so the air conditioner was not tested; running it right after power is restored can damage the compressor. Recommend leaving power on for 4 hours, then having a qualified HVAC contractor test it.", "", "limit"], ["cooling", "Cooling Equipment", "maint", "Swamp Cooler Needs Draining", "The evaporative cooler has not been drained for winter. Water left inside can freeze and damage it. Recommend draining and servicing it.", "pro", "defect"], ["cooling", "Cooling Equipment", "maint", "Unit Not Level", "The outdoor unit is not level. This can strain the compressor. Recommend levelling the pad.", "pro", "defect"], ["cooling", "Cooling Equipment", "rec", "Unusually Noisy", "The compressor is unusually noisy. This can point to wear or a failing part. Recommend a qualified HVAC contractor evaluate.", "pro", "defect"], ["cooling", "Cooling Equipment", "maint", "Vegetation Too Close", "Plants are too close to the outdoor unit. This restricts airflow and lowers efficiency. Recommend keeping 600 mm (2 ft) clear around it.", "diy", "defect"], ["cooling", "Cooling Equipment", "maint", "Condenser Dirty / Restricted", "The outdoor unit is dirty or restricted. This lowers efficiency. Recommend cleaning the coil and servicing the unit.", "pro", "defect"], ["cooling", "Cooling Equipment", "info", "Air Conditioner Did Not Operate", "The air conditioner did not operate and the cause could not be determined. Recommend a qualified HVAC contractor evaluate.", "", "limit"], ["cooling", "Cooling Equipment", "rec", "Unit Damaged", "The cooling equipment is damaged. This can affect performance and reliability. Recommend a qualified HVAC contractor repair or replace it.", "pro", "defect"], ["cooling", "Cooling Equipment", "maint", "Near End of Service Life", "The air conditioner is near or past its typical life of 15 to 20 years. Older units become less reliable and efficient. Recommend budgeting for replacement.", "monitor", "defect"], ["cooling", "Distribution System", "rec", "Return Duct Leaking", "The return air duct leaks at the unit. This reduces efficiency and can pull in dust. Recommend a qualified HVAC contractor seal it.", "pro", "defect"], ["cooling", "Distribution System", "maint", "Ducts Dented", "The ductwork is dented. Heavy dents can restrict airflow. Recommend a qualified HVAC contractor repair any restricted sections.", "pro", "defect"], ["cooling", "Distribution System", "rec", "Ducts Deteriorated", "The ductwork is deteriorated. This wastes energy and reduces airflow. Recommend a qualified HVAC contractor repair or replace it.", "pro", "defect"], ["cooling", "Distribution System", "maint", "Ducts Uninsulated", "Ductwork in unheated space is not fully insulated. This wastes energy and can cause condensation. Recommend insulating it.", "pro", "defect"], ["plumbing", "General", "info", "Water Supply Off", "The water supply was off, so the plumbing system, fixtures and drains could not be fully tested. Recommend having the water turned on and the system tested before closing.", "", "limit"], ["plumbing", "Main Water Shut-off Device", "rec", "Corrosion", "The main water shut-off is corroded. Corroded valves may leak or not close in an emergency. Recommend a licensed plumber evaluate and replace it if needed.", "plumber", "defect"], ["plumbing", "Main Water Shut-off Device", "safety", "Well Line Above Ground", "The well supply line is above ground or not buried below frost depth. This is a significant concern: it can freeze and burst, leaving the home without water. Recommend a licensed plumber or well contractor bury or protect it.", "plumber", "defect"], ["plumbing", "Main Water Shut-off Device", "maint", "Condensation at Main Shut-off", "There is condensation on the main shut-off valves. This can cause corrosion and water damage. Recommend insulating the cold water piping.", "plumber", "defect"], ["plumbing", "Main Water Shut-off Device", "info", "Well Water Testing", "The home is on a private well. Water quality and flow rate are outside the scope of this inspection. Recommend testing through the Saskatchewan Disease Control Laboratory or a private lab, and a flow test by a well contractor.", "", "info"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Improper Connection", "There is an improper connection in the drain, waste or vent piping. This can cause leaks, clogs or sewer gas. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Leaking Pipe", "The drain, waste or vent piping is leaking. Leaks cause water damage and odours. Recommend a licensed plumber repair it.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "maint", "Tub / Shower - Slow Drainage", "The tub or shower drains slowly. This usually means a partial blockage. Recommend clearing the drain, or a licensed plumber if it continues.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "maint", "Sink - Slow Drainage", "The sink drains slowly. This usually means a partial blockage. Recommend clearing the drain, or a licensed plumber if it continues.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "maint", "Septic Pumping Recommended", "The septic tank appears to need pumping. An overfull tank can back up or damage the field. Recommend a licensed septic contractor pump and inspect it, and asking the seller for records.", "pro", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Septic Pump Runs Continuously", "The septic pump runs continuously instead of cycling. This can mean a failed float and lead to pump failure or backup. Recommend a licensed septic contractor evaluate.", "pro", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "info", "Septic System Not Located", "The septic tank and field or lagoon could not be located. Recommend asking the seller for the location, permits and maintenance records.", "", "limit"], ["plumbing", "Drain, Waste, & Vent Systems", "maint", "Previous Leak at Drain", "There are signs of a past leak at drain connections, but no active leak. Leaks can return if not fully repaired. Recommend monitoring and confirming the repair with the seller.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Drain Piping Not Supported", "The drain piping is not properly supported. Unsupported pipes sag and leak at the joints. Recommend a licensed plumber add hangers.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Possible Drain Blockage", "There is heavy buildup in a drain pipe, indicating a possible blockage. A blocked drain can back up. Recommend a licensed plumber scope and clean the line.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "rec", "Sewer Scope Recommended", "The home has older drain piping or signs of drain problems. Roots, breaks and sags in the buried sewer line cannot be seen in a home inspection. Recommend a licensed plumber camera-scope the sewer line.", "plumber", "defect"], ["plumbing", "Drain, Waste, & Vent Systems", "info", "Backwater Valve Not Located", "No backwater valve was found. A backwater valve helps prevent sewer backup into the basement. Recommend asking the seller whether one is installed.", "", "info"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Supply Pipe Leaking", "The water supply piping is leaking. Leaks cause water damage and mould. Recommend a licensed plumber repair it.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Improper Installation", "The water supply piping is not installed to standard practice. This can lead to leaks or poor water flow. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Main Supply Pipe Corroded", "The main water supply pipe is heavily corroded. Corroded pipe can leak or fail. Recommend a licensed plumber evaluate and replace it as needed.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Main Valve Leaking", "The main water shut-off valve leaks. A leaking valve may not shut off fully in an emergency. Recommend a licensed plumber repair or replace it.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "maint", "Protective Sleeve Missing", "The main water pipe has no protective sleeve where it passes through concrete. Concrete can corrode copper pipe. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Polybutylene (Poly-B) Piping", "The supply piping is polybutylene (Poly-B). It has a history of sudden failures at fittings, and some insurers limit coverage. Recommend a licensed plumber evaluate and plan replacement, and checking with your insurer.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Shower - Improper Installation", "The shower is not installed properly. Water can get into the walls or floor. Recommend a qualified contractor correct it.", "pro", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Valve Leaking", "One or more valves are leaking. Leaks cause water damage over time. Recommend a licensed plumber repair or replace them.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "maint", "Exterior Faucet Not Sealed", "The exterior faucet is not sealed where it enters the wall. Water and air can get in. Recommend sealing it with exterior caulking.", "diy", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Corrosion at Supply Joints", "The water supply joints are corroded. This shows long-term moisture and can lead to leaks. Recommend a licensed plumber evaluate and repair.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "maint", "Mineral Deposits at Joints", "There are minor mineral deposits on soldered supply joints. This is usually cosmetic but can mean a slow seep. Recommend monitoring for leaks.", "monitor", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "rec", "Galvanized Steel Piping", "The supply piping is galvanized steel. It corrodes from the inside, which lowers water pressure and leads to leaks. Recommend a licensed plumber evaluate and plan replacement.", "plumber", "defect"], ["plumbing", "Water Supply, Distribution Systems & Fixtures", "maint", "Cross Connection", "There is a cross connection, such as a hose in a laundry sink or a hose bib with no vacuum breaker. Dirty water can be drawn into the drinking water. Recommend removing the hose or adding a vacuum breaker.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "info", "Access Blocked", "Stored items blocked access to the water heater, so it was not fully inspected.", "", "limit"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Corrosion", "The water heater has corrosion at the burner area or fittings. Corrosion can lead to leaks or failure. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Improper Installation", "The water heater is not installed to standard practice or is in an unsafe location. This can affect safety and performance. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "maint", "Insufficient Capacity", "The water heater may be too small for the home. You may run out of hot water. Recommend considering a larger unit when it is replaced.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "safety", "Irregular Burner Flame", "The water heater burner flame is irregular. This is a safety hazard: poor combustion can produce carbon monoxide. Recommend a licensed gas fitter evaluate and service it.", "pro", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "maint", "Near End of Service Life", "The water heater is near or past its typical life of 10 to 15 years. Older tanks are more likely to leak. Recommend budgeting for replacement.", "monitor", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Burner Did Not Ignite", "The water heater burner did not ignite. The home will not have hot water. Recommend a licensed gas fitter evaluate and repair.", "pro", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "maint", "No Drip Pan", "There is no drip pan under the water heater. A pan with a drain limits damage if the tank leaks. Recommend installing one.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "maint", "No Expansion Tank", "There is no thermal expansion tank. One is needed when the system has a check valve or backflow preventer. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Leak Stains Under Water Heater", "There is water staining under the water heater. This shows a past or active leak. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "info", "Water Heater Not Tested", "The water supply was off, so the water heater was not tested.", "", "limit"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Shut-off Valve Leaking", "The water heater shut-off valve leaks. Leaks cause water damage. Recommend a licensed plumber repair or replace it.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "safety", "TPR Discharge Pipe Missing", "The temperature and pressure relief (TPR) valve has no discharge pipe. This is a safety hazard: scalding water can spray out if it opens. Recommend a licensed plumber install a pipe ending 150 mm (6 in) or less above the floor.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "safety", "Evidence of Backdrafting", "There are signs of backdrafting (scorching or soot) at the draft hood. This is a safety hazard: carbon monoxide may be spilling into the home. Recommend a licensed gas fitter evaluate immediately and confirming working CO alarms.", "pro", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "rec", "Water Heater Damaged", "The water heater is damaged. This can lead to leaks or failure. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Hot Water Systems, Controls, Flues & Vents", "safety", "Vent Connector Defect", "The water heater vent connector is damaged, disconnected, rusted or sloped downward. This is a safety hazard: carbon monoxide can leak into the home. Recommend a licensed gas fitter correct it before use.", "pro", "defect"], ["plumbing", "Fuel Storage & Distribution Systems", "info", "Gas Off", "The gas was off at the main, so gas appliances could not be tested. Recommend having SaskEnergy turn on the gas and testing all appliances before your conditions deadline.", "", "limit"], ["plumbing", "Fuel Storage & Distribution Systems", "rec", "Gas Piping Corroded", "The gas piping is corroded. Corrosion can lead to gas leaks. Recommend a licensed gas fitter evaluate and repair.", "pro", "defect"], ["plumbing", "Fuel Storage & Distribution Systems", "safety", "Gas Odour", "There is a strong gas odour. This is a safety hazard: gas can ignite or cause poisoning. Recommend leaving the area and calling SaskEnergy's emergency line immediately.", "pro", "defect"], ["plumbing", "Fuel Storage & Distribution Systems", "safety", "Gas Piping - Improper Installation", "The gas piping is not installed to standard practice. This is a safety hazard: improper gas piping can leak. Recommend a licensed gas fitter correct it.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Tub / Shower Caulking Needed", "The caulking around the tub or shower has gaps. Water can get behind the surround. Recommend recaulking with silicone as routine maintenance.", "diy", "defect"], ["plumbing", "Bathroom", "rec", "Moisture Near Toilet", "There is moisture near the toilet, showing a possible leak. Leaks can rot the subfloor. Recommend a licensed plumber find the source.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Shower Hot / Cold Reversed", "The shower hot and cold controls are reversed. This can cause scalding. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Toilet Not Secure", "The toilet is loose at the floor. A loose toilet can break the seal and leak into the subfloor. Recommend a licensed plumber reset it.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Diverter Valve Leaking", "The tub or shower diverter leaks. Water may leak from the spout or behind the wall. Recommend a licensed plumber repair it.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "No P-Trap", "There is no P-trap under the sink. Sewer gas can enter the home. Recommend a licensed plumber install one.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Toilet Not Caulked", "The toilet is not caulked at the base. Water can get under it during cleaning. Recommend caulking the base, leaving a gap at the back so leaks show.", "diy", "defect"], ["plumbing", "Bathroom", "maint", "Diverter Not Working Properly", "The tub diverter does not fully send water to the shower head. Water runs from the spout while showering. Recommend repairing or replacing it.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Suspected Mould in Shower", "There is mould-like growth in the shower area. It shows excess moisture and can affect air quality. Recommend cleaning, improving ventilation, and a qualified contractor check behind the surround if it returns.", "pro", "defect"], ["plumbing", "Bathroom", "rec", "Moisture Damage in Shower Surround", "The shower surround shows water damage. Water behind it can rot framing and promote mould. Recommend a qualified contractor evaluate and repair.", "pro", "defect"], ["plumbing", "Bathroom", "rec", "Shower Inoperable", "The shower did not operate. The fixture or valve may be faulty. Recommend a licensed plumber repair it.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Leaking Faucet", "A faucet leaks. This wastes water and can damage the vanity. Recommend repairing or replacing it.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Leaking Shower Head", "The shower head drips after being turned off. This usually means a worn valve cartridge. Recommend repairing it.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Shower Drain Not Seated", "The shower drain strainer does not sit properly. Water may not drain well. Recommend reinstalling it.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Slow Toilet Flush", "The toilet flushes slowly. This may be a partial blockage or fill valve problem. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Sink Stopper Not Working", "The sink stopper does not work. The sink cannot hold water. Recommend repairing or replacing it.", "diy", "defect"], ["plumbing", "Bathroom", "rec", "Flooring Lifting Near Shower", "The flooring is lifting near the shower. This usually means water has got underneath. Recommend a flooring contractor check the subfloor and replace the flooring.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Tub Enamel Chipped / Worn", "The tub enamel is chipped or worn. Exposed steel can rust. Recommend repairing or refinishing it.", "pro", "defect"], ["plumbing", "Bathroom", "rec", "Wood Swelling", "Wood in the bathroom is swollen. This shows moisture exposure. Recommend finding and correcting the source.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Shower Grout Cracked", "The shower grout is cracked. Water can get behind the tile. Recommend regrouting and sealing.", "diy", "defect"], ["plumbing", "Bathroom", "maint", "Toilet Tank Lid Cracked", "The toilet tank lid is cracked. It can break and cause injury. Recommend replacing it.", "diy", "defect"], ["plumbing", "Bathroom", "rec", "Tub Surround Delaminating", "The tub surround is separating from the wall. Water can get behind it. Recommend a qualified contractor repair or replace it.", "pro", "defect"], ["plumbing", "Bathroom", "rec", "No Proper Shower Surround", "The shower has no proper water-resistant surround. Water can get into the walls. Recommend a qualified contractor install one.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Shower Head Sprays Out of Enclosure", "The shower head sprays water outside the tub. Water on the floor can cause damage and slips. Recommend adjusting or replacing it.", "diy", "defect"], ["plumbing", "Bathroom", "maint", "Shower Door Sweep Worn", "The seal under the shower door is worn. Water can leak onto the floor. Recommend replacing it.", "diy", "defect"], ["plumbing", "Bathroom", "rec", "Flooring at Toilet Not Sealed", "The flooring around the toilet is not fitted or sealed properly. Water can get under the floor. Recommend a qualified contractor correct it.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Jetted Tub Controller Inoperable", "The jetted tub controller did not work. The jets cannot be used. Recommend a qualified technician repair it.", "pro", "defect"], ["plumbing", "Bathroom", "info", "Jetted Tub", "A jetted tub is installed. The jets were run using normal controls only, and the internal piping was not inspected.", "", "info"], ["plumbing", "Bathroom", "maint", "Tub Overflow Installed Upside Down", "The tub overflow cover is upside down, so the overflow may not work. The tub could overfill. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Leaking Tub Spout", "The tub spout drips after being turned off. This wastes water and usually means a worn valve part. Recommend repairing it.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Low Water Pressure", "The water pressure at the fixtures is low. Clogged aerators, partly closed valves or supply problems can cause this. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "No Shower Curtain", "There is no shower curtain or door. Water can splash onto the floor and cause damage or slips. Recommend installing one.", "diy", "defect"], ["plumbing", "Bathroom", "maint", "Tub Spout Not Sealed", "The tub spout is not sealed to the wall. Water can get behind the surround. Recommend sealing it as routine maintenance.", "diy", "defect"], ["plumbing", "Bathroom", "maint", "No Fixture Shut-offs", "There are no shut-off valves under the bathroom sink. Without them, the whole house water must be shut off for repairs. Recommend a licensed plumber install them.", "plumber", "defect"], ["plumbing", "Bathroom", "rec", "Vanity Not Secure", "The vanity is not secured to the wall. It can shift and strain the plumbing connections. Recommend securing it.", "pro", "defect"], ["plumbing", "Bathroom", "maint", "Tub Drain Gurgling / Slow", "The tub drain gurgles and drains slowly. This can point to a venting problem. Recommend a licensed plumber evaluate.", "plumber", "defect"], ["plumbing", "Bathroom", "maint", "Toilet Runs Continuously", "The toilet keeps running after flushing. This wastes water. Recommend replacing the flapper or fill valve.", "diy", "defect"], ["plumbing", "Sump Pump", "rec", "Improper Installation", "The sump pump is not installed to standard practice. It may not protect the basement from flooding. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Sump Pump", "safety", "Inoperable", "The sump pump did not operate. This is a significant concern: without a working pump, the basement can flood. Recommend a licensed plumber repair or replace it promptly.", "plumber", "defect"], ["plumbing", "Sump Pump", "maint", "Needs Cleaning", "The sump pit and pump are dirty. Debris can jam the float and stop the pump. Recommend cleaning it as routine maintenance.", "diy", "defect"], ["plumbing", "Sump Pump", "rec", "No Check Valve", "There is no check valve on the sump discharge. Water flows back into the pit and the pump cycles more often. Recommend a licensed plumber install one.", "plumber", "defect"], ["plumbing", "Sump Pump", "info", "Sump Pump Not Accessible", "The sump pump could not be accessed and was not tested. Recommend asking the seller to confirm it works.", "", "limit"], ["plumbing", "Kitchen", "maint", "Loose Faucet", "The kitchen faucet is loose. Movement can loosen the connections and cause leaks. Recommend tightening it.", "diy", "defect"], ["plumbing", "Kitchen", "rec", "Previous Leak Under Sink", "There are water stains under the sink from a past leak. Leaks can return if not fully repaired. Recommend a licensed plumber check the connections.", "plumber", "defect"], ["plumbing", "Kitchen", "maint", "Faucet Damaged", "The kitchen faucet is damaged. This can lead to leaks or poor operation. Recommend repairing or replacing it.", "plumber", "defect"], ["plumbing", "Kitchen", "maint", "No Fixture Shut-offs", "There are no shut-off valves under the kitchen sink. Without them, the whole house water must be shut off for repairs. Recommend a licensed plumber install them.", "plumber", "defect"], ["plumbing", "Exterior Water Supply", "rec", "Exterior Faucet Leaking", "The exterior faucet leaks. Water can get into the wall or foundation. Recommend repairing or replacing it.", "plumber", "defect"], ["plumbing", "Exterior Water Supply", "maint", "Previous Leak at Exterior Faucet", "There is staining near the exterior faucet from a past leak. Leaks can return, especially after a freeze. Recommend monitoring and installing a frost-free faucet if it leaks again.", "monitor", "defect"], ["plumbing", "Exterior Water Supply", "rec", "Exterior Faucet Missing", "The exterior faucet is missing and the supply line is capped or open. An open line can leak or freeze. Recommend a licensed plumber confirm it is capped or install a frost-free faucet.", "plumber", "defect"], ["plumbing", "Radon Test", "info", "Radon", "Radon is a radioactive soil gas and the second leading cause of lung cancer in Canada; many Saskatchewan homes have high levels. Radon was not tested. Recommend a long-term test of at least 3 months in the lowest lived-in level.", "", "info"], ["plumbing", "Plumbing Fixtures", "rec", "Hot / Cold Reversed", "The hot and cold supply lines are reversed at the faucet. This can cause scalding. Recommend a licensed plumber correct it.", "plumber", "defect"], ["plumbing", "Plumbing Fixtures", "maint", "Sink Cracked", "The sink is cracked. Cracks can leak and spread. Recommend replacing it.", "plumber", "defect"], ["electrical", "Service Entrance Conductors", "safety", "Service Cable Damaged", "The service entrance cable sheathing is damaged. This is a shock and fire hazard. Recommend contacting SaskPower and a licensed electrician to repair it.", "electrician", "defect"], ["electrical", "Service Entrance Conductors", "rec", "Mast Improperly Installed", "The service mast is not properly installed or secured. A loose mast can be pulled down by the service wires, especially under ice. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Service Entrance Conductors", "safety", "Low Service Drop Clearance", "The overhead service wires are too low above the roof or ground. This is a shock hazard. Recommend contacting SaskPower and a licensed electrician to correct it.", "electrician", "defect"], ["electrical", "Service Entrance Conductors", "rec", "Water Entry at Meter / Service", "There are signs of water entry at the meter base or service entrance. Moisture corrodes electrical parts. Recommend a licensed electrician evaluate and repair.", "electrician", "defect"], ["electrical", "Service Entrance Conductors", "maint", "Communication Line Low", "A data or phone line hangs too close to the garage roof. It can be damaged. Recommend asking the service provider to raise it.", "pro", "defect"], ["electrical", "Service Entrance Conductors", "safety", "Trees Near Service Line", "Tree branches are touching or close to the overhead service line. This is a fire and shock hazard and can cause outages. Recommend contacting SaskPower to trim them safely, not doing it yourself.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Breaker Incorrectly Wired", "A breaker is wired or installed incorrectly. This is a fire hazard and suggests unqualified work. Recommend a licensed electrician check and correct the whole panel.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Inadequate Grounding", "The service grounding appears inadequate. This is a shock hazard: grounding protects people during electrical faults. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Meter Base Not Matched to Service", "The meter base does not appear to match the upgraded service wiring. This can cause overheating at the connections. Recommend a licensed electrician evaluate.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Open Knockouts", "The panel has open knockouts that expose live parts. This is a shock hazard. Recommend a licensed electrician install knockout seals.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Meter Base Loose", "The meter base is loose on the wall. This strains the service wires and connections. Recommend a licensed electrician re-secure it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "maint", "Panel Not Labelled", "The panel circuits are not labelled. In an emergency, you need to know which breaker controls what. Recommend labelling all circuits.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Ground Wire Missing", "No grounding conductor was found. This is a shock hazard. Recommend a licensed electrician install proper grounding.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Panel Damaged", "The electrical panel or its cover is damaged. This can expose live parts. Recommend a licensed electrician repair or replace it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Double-Tapped Breaker", "Two wires are connected to a breaker made for one (double tap). This is a fire hazard: loose connections can overheat. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Grounds and Neutrals Not Separated", "Ground and neutral wires share a bar in the subpanel. This is a shock hazard: they must be separate in a subpanel. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Splices in Panel", "There are wire splices inside the panel. Splices belong in junction boxes, where they are protected and accessible. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Cables Not Secured at Panel", "Cables are not secured where they enter the panel. Loose cables strain connections and can be cut by sharp edges. Recommend a licensed electrician install proper connectors.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Overheated Wire", "A wire at a breaker shows signs of overheating. This is a fire hazard. Recommend a licensed electrician repair it immediately.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Panel Cover Screws Missing", "Screws are missing from the panel cover. The cover can come loose and expose live parts. Recommend installing the correct screws.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Breaker Damaged", "A breaker is damaged. This is a fire hazard: it may not trip during an overload. Recommend a licensed electrician replace it.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "maint", "Panel Mounted Too High", "The top breaker is more than 1.7 m (67 in) above the floor. This makes it hard to reach in an emergency. Recommend a licensed electrician evaluate.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Oversized Breaker", "A breaker is too large for the wire it protects. This is a fire hazard: the wire can overheat before the breaker trips. Recommend a licensed electrician correct it promptly.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Previous Arcing / Fire", "There are signs of past arcing or burning in the panel. This is a fire hazard until the cause is confirmed fixed. Recommend a licensed electrician evaluate the system.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Moisture in Panel", "There are signs of moisture in the electrical panel. This is a shock and fire hazard: moisture corrodes connections. Recommend a licensed electrician find the source and repair.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Rusted Neutral Screws", "The neutral screws in the panel are rusted. This shows moisture exposure and can loosen connections. Recommend a licensed electrician replace corroded parts.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "rec", "Federal Pioneer Stab-Lok Panel", "The panel is a Federal Pioneer Stab-Lok. Some of these breakers have a history of not tripping under overload, and some insurers ask about them. Recommend a licensed electrician evaluate, and checking with your insurer.", "electrician", "defect"], ["electrical", "Main & Subpanels, Service & Grounding, Main Overcurrent Device", "safety", "Fuse Panel / Oversized Fuses", "The home has a fuse panel with fuses larger than the wire they protect. This is a fire hazard, and many insurers limit coverage for fuse panels. Recommend a licensed electrician evaluate and upgrade.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "rec", "Aluminum Branch Wiring", "The home has solid aluminum branch wiring. It needs aluminum-rated devices and connections to avoid overheating, and some insurers ask about it. Recommend a licensed electrician evaluate.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "rec", "Improper Wiring", "Wiring is not installed to standard practice. This can create shock or fire risks. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "rec", "Service Capacity May Be Insufficient", "The electrical service may be too small for the home's use. Overloaded circuits can trip or overheat. Recommend a licensed electrician evaluate the load.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "safety", "Exposed Bare Wires", "There is exposed or unprotected wiring. This is a shock and fire hazard. Recommend a licensed electrician correct it immediately.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "rec", "Knob and Tube Wiring", "The home has knob and tube wiring. It has no ground, its insulation becomes brittle, and many insurers will not cover it. Recommend a licensed electrician evaluate and plan replacement, and checking with your insurer.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "safety", "Extension Cord Used as Permanent Wiring", "An extension cord is being used as permanent wiring. This is a fire hazard: cords overheat and are easily damaged. Recommend a licensed electrician install proper wiring.", "electrician", "defect"], ["electrical", "Branch Wiring Circuits, Breakers & Fuses", "safety", "Open Junction Box", "A junction box has no cover, exposing wire connections. This is a shock hazard. Recommend installing a cover.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Cover Plate Damaged", "A cover plate is damaged. Cracked plates can expose wiring. Recommend replacing it.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Cover Plate Missing", "Cover plates are missing at switches or receptacles, exposing wiring. This is a shock hazard. Recommend installing cover plates.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Few Receptacles", "The home has few receptacles. This leads to extension cord use and overloaded circuits. Recommend a licensed electrician add receptacles where needed.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Light Inoperable", "One or more lights did not work. This may be a burnt-out bulb or a wiring fault. Recommend replacing the bulb, and a licensed electrician check it if it still does not work.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Reverse Polarity", "One or more receptacles have reversed polarity. This is a shock hazard. Recommend a licensed electrician correct it.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Switches Improperly Installed", "One or more switches are not installed properly. This can cause shock or fire risks. Recommend a licensed electrician correct them.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Open Ground", "One or more three-prong receptacles tested with an open ground. This is a shock hazard: they look grounded but are not. Recommend a licensed electrician correct them.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Receptacle Burnt", "A receptacle has burn marks from overheating. This is a fire hazard. Recommend a licensed electrician replace it and check the circuit.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Moisture in Electrical Box", "There is moisture inside an electrical box. This is a shock hazard. Recommend a licensed electrician find the source and repair.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Cover Plate Screw Missing", "A cover plate screw is missing. The plate can loosen and expose wiring. Recommend installing the screw.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Doorbell Button Damaged", "The doorbell button is damaged. It may not work reliably. Recommend replacing it.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Doorbell Button Missing - Exposed Wires", "The doorbell button is missing and the wires are exposed. Exposed wires can short. Recommend installing a button or capping the wires.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Two-Prong Receptacles", "The home has ungrounded two-prong receptacles. They do not protect like grounded receptacles and cannot take three-prong plugs. Recommend a licensed electrician upgrade them or add GFCI protection.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Exterior Light Damaged", "The exterior light is damaged. Water can get in. Recommend repairing or replacing it.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Doorbell Loose", "The doorbell is loose. Movement can damage the wiring. Recommend re-securing it.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Open Neutral", "An open neutral was detected. This is a fire hazard: it can cause voltage swings that damage appliances. Recommend a licensed electrician repair it immediately.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Doorbell Buttons Missing", "The doorbell buttons are missing. Visitors cannot ring. Recommend installing them.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Electrical Box Not Secured", "One or more electrical boxes are loose. Loose boxes strain the wiring. Recommend securing them.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Weatherproof Cover Damaged / Unsealed", "An exterior box or cover is damaged or unsealed. Water can get in and cause a short. Recommend a licensed electrician repair it.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Interior Cable Used Outdoors", "Interior-rated cable (NMD) is used outdoors. This is a shock hazard: it is not made for sunlight and moisture. Recommend a licensed electrician replace it with exterior-rated wiring.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "rec", "Interior Box Used Outdoors", "An indoor-rated electrical box is installed outside. Water can get in. Recommend a licensed electrician replace it with a weatherproof box.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Furnace Switch Not Labelled", "The furnace shut-off switch is not labelled. It can be mistaken for a light switch. Recommend labelling it.", "diy", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "safety", "Open Splices", "There are wire splices without connectors or outside a junction box. This is a shock and fire hazard. Recommend a licensed electrician correct them immediately.", "electrician", "defect"], ["electrical", "Lighting Fixtures, Switches & Receptacles", "maint", "Unknown Switches", "The purpose of some switches could not be determined. Unknown switches may control hidden equipment. Recommend asking the seller and labelling them.", "diy", "defect"], ["electrical", "GFCI & AFCI", "rec", "Improper Installation", "The GFCI or AFCI protection is not installed properly. It may not protect as intended. Recommend a licensed electrician evaluate.", "electrician", "defect"], ["electrical", "GFCI & AFCI", "safety", "No GFCI Protection", "Receptacles near water (kitchen, bathroom, laundry, exterior, garage) have no GFCI protection. This is a shock hazard. Recommend a licensed electrician install GFCI protection.", "electrician", "defect"], ["electrical", "GFCI & AFCI", "safety", "GFCI Did Not Trip", "A GFCI receptacle did not trip or reset when tested. This is a shock hazard. Recommend a licensed electrician replace it.", "electrician", "defect"], ["electrical", "GFCI & AFCI", "rec", "Exterior Receptacle Cover Missing", "Exterior receptacles are missing weatherproof covers. Water can get in. Recommend installing in-use covers.", "electrician", "defect"], ["electrical", "GFCI & AFCI", "info", "GFCI Protection Downstream", "Some receptacles are protected by a GFCI elsewhere on the circuit. If one has no power, check for a tripped GFCI.", "", "info"], ["electrical", "Smoke Detectors", "safety", "Smoke Alarm Not Working", "A smoke alarm did not respond when tested. This is a safety hazard. Recommend replacing it.", "diy", "defect"], ["electrical", "Smoke Detectors", "info", "Smoke Alarm Not Tested", "Smoke alarms were not accessible and were not tested. Recommend testing all alarms after moving in.", "", "limit"], ["electrical", "Smoke Detectors", "maint", "Smoke Alarm Location", "A smoke alarm is in a poor location. It may not detect smoke early. Recommend relocating it to the manufacturer's instructions.", "diy", "defect"], ["electrical", "Smoke Detectors", "safety", "Smoke Alarm Battery", "A smoke alarm did not respond when tested, possibly from a dead battery. This is a safety hazard. Recommend replacing the battery and testing it.", "diy", "defect"], ["electrical", "Smoke Detectors", "safety", "Smoke Alarm Missing", "Smoke alarms are missing in one or more required locations. This is a safety hazard. Recommend installing alarms on every level and outside sleeping areas.", "diy", "defect"], ["electrical", "Smoke Detectors", "safety", "Smoke Alarms Not Installed", "Smoke alarms are present but not installed. This is a safety hazard. Recommend installing and testing them.", "diy", "defect"], ["electrical", "Smoke Detectors", "safety", "Smoke Alarm Expired", "A smoke alarm is past its 10-year replacement date. This is a safety hazard: old alarms may not work. Recommend replacing it.", "diy", "defect"], ["electrical", "Carbon Monoxide Detectors", "safety", "CO Alarm Not Working", "A carbon monoxide alarm did not respond when tested. This is a safety hazard. Recommend replacing it.", "diy", "defect"], ["electrical", "Carbon Monoxide Detectors", "info", "CO Alarm Not Tested", "Carbon monoxide alarms were not accessible and were not tested. Recommend testing all alarms after moving in.", "", "limit"], ["electrical", "Carbon Monoxide Detectors", "maint", "CO Alarm Location", "A carbon monoxide alarm is in a poor location. It may not warn in time. Recommend relocating it to the manufacturer's instructions.", "diy", "defect"], ["electrical", "Carbon Monoxide Detectors", "safety", "CO Alarm Battery", "A carbon monoxide alarm did not respond when tested, possibly from a dead battery. This is a safety hazard. Recommend replacing the battery and testing it.", "diy", "defect"], ["electrical", "Carbon Monoxide Detectors", "safety", "CO Alarm Missing", "There is no carbon monoxide alarm. This is a safety hazard in a home with fuel-burning appliances or an attached garage. Recommend installing CO alarms near sleeping areas.", "diy", "defect"], ["electrical", "Carbon Monoxide Detectors", "safety", "CO Alarm Expired", "The carbon monoxide alarm is past its replacement date. This is a safety hazard: old alarms may not work. Recommend replacing it.", "diy", "defect"], ["fireplace", "General", "info", "Gas Off - Not Tested", "The gas was off, so the gas fireplace could not be tested. Recommend having the gas turned on and the fireplace tested before closing.", "", "limit"], ["fireplace", "General", "info", "Insert Did Not Operate", "The fireplace insert did not operate and the cause could not be determined. Recommend a qualified fireplace technician evaluate.", "", "limit"], ["fireplace", "General", "maint", "Firebox Dirty", "Soot, ash and debris have built up in the firebox. Buildup is a fire risk and hides damage. Recommend a WETT-certified chimney sweep clean and inspect it before use.", "pro", "defect"], ["fireplace", "General", "rec", "WETT Inspection Recommended", "There is a wood-burning appliance, and its installation and chimney were only checked visually. Many insurers require a WETT inspection. Recommend a WETT-certified inspector inspect it before use.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Creosote Build-up", "Creosote has built up in the flue or liner. This is a fire hazard: creosote can ignite and cause a chimney fire. Recommend a WETT-certified chimney sweep clean and inspect it before use.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Chimney Unstable", "The chimney appears damaged or unstable. This is a safety hazard: it could shift or collapse. Recommend a qualified masonry contractor or structural engineer evaluate before use.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Flue Improperly Installed", "The flue or vent is not installed properly. This is a safety hazard: combustion gases may not vent safely. Recommend a WETT-certified technician or licensed gas fitter correct it before use.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Appliance Vents Into Unlined Chimney", "A furnace or water heater vents into an unlined chimney. This is a safety hazard: condensation can damage the chimney and gases may not vent safely. Recommend a licensed gas fitter install a liner.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Chimney Pipe Joints Open", "The chimney pipe joints have gaps or failed sealant. This is a safety hazard: smoke and carbon monoxide can leak into the home. Recommend a WETT-certified technician correct it.", "pro", "defect"], ["fireplace", "Vents, Flues & Chimneys", "maint", "Insert Glass Dirty", "The fireplace glass has soot on it. Heavy soot can mean poor combustion. Recommend cleaning it with fireplace glass cleaner.", "diy", "defect"], ["fireplace", "Vents, Flues & Chimneys", "safety", "Clearance to Combustibles", "The wood stove or chimney pipe is too close to combustible materials. This is a fire hazard. Recommend a WETT-certified technician evaluate before use.", "pro", "defect"], ["fireplace", "Lintels", "safety", "Firebox Cracked", "The firebox lining is cracked. This is a fire hazard: heat can reach the framing behind it. Recommend a WETT-certified technician repair it before use.", "pro", "defect"], ["fireplace", "Lintels", "rec", "Hearth Too Short", "The hearth extension appears too small; a typical hearth extends 400 mm (16 in) in front and 200 mm (8 in) to each side. Embers can land on the floor. Recommend a WETT-certified technician evaluate.", "pro", "defect"], ["fireplace", "Lintels", "maint", "Hearth Tiles Broken", "Some hearth tiles are broken. Gaps can let heat reach the material below. Recommend repairing them.", "pro", "defect"], ["fireplace", "Damper Doors", "safety", "Damper Inoperable", "The damper does not operate. This is a safety hazard: a stuck damper can push smoke and carbon monoxide into the home. Recommend a WETT-certified technician repair it before use.", "pro", "defect"], ["fireplace", "Cleanout Doors & Frames", "safety", "Combustibles Too Close", "Combustible items are too close to the fireplace. This is a fire hazard. Recommend keeping the area clear.", "diy", "defect"], ["fireplace", "Cleanout Doors & Frames", "rec", "No Fireplace Screen", "There is no fireplace screen or door. Embers can escape onto the floor. Recommend installing a screen.", "diy", "defect"], ["attic-insulation-ventila", "General", "safety", "Dryer Vent Blocked", "The exterior dryer vent is blocked with lint. This is a fire hazard and pushes moisture into the home. Recommend cleaning the vent and duct.", "diy", "defect"], ["attic-insulation-ventila", "General", "rec", "Dryer Duct Kinked", "The dryer duct is pinched or kinked. Lint builds up and creates a fire risk. Recommend straightening it or replacing it with a rigid metal duct.", "diy", "defect"], ["attic-insulation-ventila", "General", "rec", "Exterior Exhaust Hood Damaged", "An exterior exhaust hood is damaged. Water, pests and cold air can get in. Recommend repairing or replacing it.", "pro", "defect"], ["attic-insulation-ventila", "Vapor Retarders (Crawlspace or Basement)", "rec", "Vapour Barrier - Improper Installation", "The vapour barrier is not installed properly. Moisture can get into the structure. Recommend an insulation contractor correct it.", "pro", "defect"], ["attic-insulation-ventila", "Vapor Retarders (Crawlspace or Basement)", "rec", "No Vapour Barrier", "There is no vapour barrier. Moisture can get into the structure. Recommend an insulation contractor evaluate.", "pro", "defect"], ["attic-insulation-ventila", "Vapor Retarders (Crawlspace or Basement)", "rec", "Vapour Barrier Damaged", "The vapour barrier is damaged in areas. Moisture can get through the gaps. Recommend an insulation contractor repair it.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "rec", "Insulation Damaged", "The attic insulation is disturbed or damaged, possibly by pests. This reduces its effectiveness. Recommend an insulation contractor repair it and a pest control professional check for activity.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "rec", "Insulation - Improper Installation", "The attic insulation is not installed properly. Gaps reduce its effectiveness. Recommend an insulation contractor correct it.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "maint", "Insufficient Insulation", "The attic insulation is below current recommended levels (about R-50, or 400 mm / 16 in of blown fibreglass in Saskatchewan). This raises heating costs and can cause ice dams. Recommend an insulation contractor add insulation.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "info", "Attic Not Accessible", "The attic was not accessible and was not inspected.", "", "limit"], ["attic-insulation-ventila", "Attic Insulation", "safety", "Damaged Truss", "A roof truss is cracked, cut or damaged. This is a significant structural concern: trusses are engineered and damage reduces their strength. Recommend a structural engineer evaluate.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "safety", "Vermiculite Insulation", "The attic has vermiculite insulation, which may contain asbestos. This is a health hazard if disturbed. Recommend testing by a qualified lab before any attic work, and removal by an abatement contractor if needed.", "pro", "defect"], ["attic-insulation-ventila", "Attic Insulation", "maint", "Attic Hatch Not Insulated / Sealed", "The attic hatch is not insulated or weatherstripped. Warm, moist air can leak into the attic and cause frost. Recommend insulating and weatherstripping it.", "diy", "defect"], ["attic-insulation-ventila", "V       doc.setFontSize(11); doc.setTextColor(20, 22, 26); doc.text(doc.splitTextToSize(agName(ag), x + bw - tx - 8)[0], tx, top + 35);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(70);
      [ag.agency, ag.phone, ag.email].filter(Boolean).forEach((l, q) => doc.text(doc.splitTextToSize(l, x + bw - tx - 8)[0], tx, top + 48 + q * 11));
    }
    y += 86;
  }
  // intro + legend start the next page
  doc.addPage(); y = M; heading("About this report");
  para(s.intro, 10, "normal", [70, 70, 70]);
  y += 8; for (const k of ["safety", "rec", "maint", "info"]) { need(16); doc.setFillColor(...SEV[k].rgb); doc.rect(M, y + 2, 10, 10, "F"); doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(34); doc.text(SEV[k].label, M + 16, y + 11); y += 16; }
  y += 14;
  // summary
  heading("Summary");
  if (i.summary) { para(i.summary, 10.5); y += 8; }
  for (const k of ["safety", "rec", "maint"]) {
    const l = F.filter(x => x.cm.sev === k); if (!l.length) continue;
    need(30); y += 6; para(`${SEV[k].label} (${l.length})`, 12, "bold", SEV[k].rgb);
    for (const x of l) { need(16); doc.setFillColor(...SEV[k].rgb); doc.circle(M + 4, y + 7, 2.2, "F"); para(`${x.sec.name} › ${x.it.name}: ${x.cm.title || x.cm.text.split(". ")[0]}`, 10, "normal", [34, 34, 34], CW - 14, M + 14); }
  }
  if (!F.some(x => x.cm.sev !== "info")) para("No defects were recorded.", 10.5);
  // sections
  for (const sec of i.sections) {
    doc.addPage(); y = M; heading(sec.name);
    const infos = sec.items.flatMap(it => tplItem(sec, it.tpl || it.name).info.map(f => [it.name + " - " + f.label, infoVal(f, (it.info || {})[fkey(f.label)])])).filter(r => r[1]);
    doc.setFontSize(9.5);
    for (const [k, v] of infos) { const lines = doc.splitTextToSize(String(v), CW - 210); need(lines.length * 12 + 2); doc.setFont("helvetica", "bold"); doc.setTextColor(104, 112, 122); doc.text(doc.splitTextToSize(k, 200)[0], M, y + 10); doc.setFont("helvetica", "normal"); doc.setTextColor(34); lines.forEach((ln, q) => doc.text(ln, M + 210, y + 10 + q * 12)); y += lines.length * 12 + 2; }
    if (infos.length) y += 6;
    // status table
    const stTxt = { I: "Inspected", NI: "Not inspected", NP: "Not present", "": "Not inspected" };
    const half = Math.ceil(sec.items.length / 2);
    need(half * 14 + 6);
    sec.items.forEach((it, n) => { const col = n < half ? 0 : 1, row = n < half ? n : n - half, x = M + col * (CW / 2), yy = y + row * 14; doc.setFontSize(9.5); doc.setFont("helvetica", "normal"); doc.setTextColor(34); doc.text(doc.splitTextToSize(it.name, CW / 2 - 92)[0], x, yy + 10); doc.setTextColor(it.st === "I" ? 43 : 140, it.st === "I" ? 138 : 140, it.st === "I" ? 62 : 140); doc.text(stTxt[it.st || ""], x + CW / 2 - 12, yy + 10, { align: "right" }); });
    y += half * 14 + 10;
    const list = sec.items.flatMap(it => it.comments.map(cm => ({ it, cm })));
    if (!list.length) { para("No findings in this section.", 10, "italic", [110, 110, 110]); continue; }
    for (const { it, cm } of list) {
      need(60); y += 6; barTop = y; barRgb = SEV[cm.sev].rgb;
      para(`${it.name} - ${cm.title || SEV[cm.sev].label}`, 11, "bold", [20, 22, 26], CW - 14, M + 12);
      para(SEV[cm.sev].label + (cm.loc ? "  ·  Location: " + cm.loc : ""), 8.5, "bold", SEV[cm.sev].rgb, CW - 14, M + 12);
      para(cm.text, 10, "normal", [34, 34, 34], CW - 14, M + 12);
      // photos two per row
      const ps = cm.photos.filter(ph => imgData[ph.id]);
      for (let p = 0; p < ps.length; p += 2) {
        const pair = ps.slice(p, p + 2), pw = (CW - 14 - 10) / 2;
        const hs = pair.map(ph => Math.min(190, pw * (ph.h || 3) / (ph.w || 4))); const ph0 = Math.max(...hs);
        const capH = pair.some(ph => ph.note) ? 13 : 0;
        need(ph0 + 8 + capH); y += 4;
        pair.forEach((ph, n) => { const w = Math.min(pw, hs[n] * (ph.w || 4) / (ph.h || 3)), x = M + 12 + n * (pw + 10); try { doc.addImage(imgData[ph.id], "JPEG", x, y, w, hs[n]); } catch (x2) {} if (ph.note) { doc.setFont("helvetica", "italic"); doc.setFontSize(8.5); doc.setTextColor(90); doc.text(doc.splitTextToSize(ph.note, pw)[0], x, y + hs[n] + 10); } });
        y += ph0 + 4 + capH;
      }
      doc.setDrawColor(...barRgb); doc.setLineWidth(3); doc.line(M + 2, barTop, M + 2, y); barTop = null;
      y += 6;
    }
  }
  doc.addPage(); y = M; heading("Scope & limitations"); para(s.intro, 10); y += 6; para(s.limits, 10);
  y += 16; para(`Inspected by ${s.inspector || s.bizName}${s.cert ? ", " + s.cert : ""} · ${s.bizName} · ${s.phone}`, 10, "bold");
  foot();
  return doc.output("blob");
}
function reportName(i) { return safeName(`Inspection Report - ${i.number ? i.number + " - " : ""}${i.address || "property"}`) + ".pdf"; }
async function publish(i, how) {
  state.busy.pdf = "Building PDF…"; render();
  try {
    const blob = await buildPdf(i);
    if (how === "download") { if (!downloads) throw { message: "Downloads aren't available here." }; await downloads.save({ filename: reportName(i), data: blob }); toast("PDF ready."); }
    else {
      if (!mcp) throw { message: "Google Drive isn't connected here - use Download PDF." };
      state.busy.pdf = "Saving to Drive…"; render();
      const up = await uploadToDrive(blob, reportName(i), "application/pdf", await inspFolder(i));
      i.published = { id: up.id, url: up.url, at: Date.now(), shared: "" }; i.status = "Published"; saveInsp(i);
      toast("Report saved to Google Drive.");
    }
  } catch (e) { toast(e && e.message && !e.code ? e.message : mcpMsg(e), "err"); console.error(e); }
  state.busy.pdf = false; render();
}
async function shareReport(i, a, to) {
  if (!i.published || !mcp) return; to = to || i.client.email;
  a.disabled = true;
  try { await mcp.callTool("Google Drive", "share_file", { fileId: i.published.id, role: "reader", emailAddress: to }); const sh = (i.published.shared || "").split(", ").filter(Boolean); if (!sh.includes(to)) sh.push(to); i.published.shared = sh.join(", "); saveInsp(i); toast("Shared - Google emails " + to + " a link."); }
  catch (e) { toast(mcpMsg(e), "err"); }
  render();
}

boot();
}
</script>
